name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: trace hover dismissal
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: ./packages/e2e
        run: npm run e2e:headless -- --filter=editor.hover-dismissal --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: upload hover dismissal trace
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: hover-dismissal-trace
          path: packages/e2e/renderer-worker-traces/
          if-no-files-found: error
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: editor status bar e2e
        working-directory: ./packages/e2e-status-bar
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: install memory benchmark browser
        working-directory: ./packages/build
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: checkout memory baseline
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .tmp/hover-baseline
      - name: measure memory baseline
        if: runner.os == 'Linux'
        working-directory: .tmp/hover-baseline
        run: |
          ln -s ../../node_modules node_modules
          npm run build
          npm run measure --workspace=packages/build
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: native pointer hover regression
        run: node packages/build/src/testHoverPointer.ts
        timeout-minutes: 2
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: measure
        working-directory: ./packages/build
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
