name: Integration
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: a870acc8628800f8b2bfd2bbbe151dd9ee0b2d30
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Build application static assets
        working-directory: .tmp/lvce-integration
        run: npm run build:static
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Rebuild prepared application static assets
        working-directory: .tmp/lvce-integration
        run: npm run build:static
      - name: Check editor cursor uses effective row height
        run: node packages/e2e-integration/check-editor-cursor-css.mjs .tmp/lvce-integration
      - name: Run owned integration tests
        shell: bash
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-language-mode-persistence
      - name: Test editor breadcrumbs
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-breadcrumbs
        shell: bash
      - name: Test editor line height respects font size
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-line-height-min-font-size
        shell: bash
      - name: Test live editor line height updates the cursor
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-line-height-live-cursor
        shell: bash
      - name: Test settings select defaults and persistence
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.settings-select-item
        shell: bash
      - name: Test bundled font loading
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: node scripts/test-font-loading.mjs
        shell: bash
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
