name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 95ac388e119a4db79d6a7f232638034298317064
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Run owned integration tests
        shell: bash
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless --
