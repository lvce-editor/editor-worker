name: Integration
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: f0d4aa32dfd505ff1fac00a65b9f5b195b0cdb62
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Build application static assets
        working-directory: .tmp/lvce-integration
        run: npm run build:static
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Rebuild prepared application static assets
        working-directory: .tmp/lvce-integration
        run: npm run build:static
      - name: Prepare built-in settings for source server
        run: node packages/e2e-integration/copy-builtin-settings.mjs .tmp/lvce-integration
      - name: Select Node source-server runtime
        run: node packages/e2e-integration/prepare-source-runtime.mjs .tmp/lvce-integration
      - name: Check editor cursor uses effective row height
        run: node packages/e2e-integration/check-editor-cursor-css.mjs .tmp/lvce-integration
      - name: Test direct native editor events with real animation frames
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-direct-events --browser-test=scripts/test-direct-editor-events.mjs
        env:
          LVCE_DIRECT_EVENTS_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/direct-editor-events
      - name: Upload direct editor event trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-editor-events-${{ matrix.os }}
          path: .tmp/direct-editor-events
          if-no-files-found: warn
      - name: Run owned integration tests
        shell: bash
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-language-mode-persistence
      - name: Test Bash syntax highlighting in YAML workflows
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=editor.syntax-highlighting-yaml
      - name: Test Find widget persistence across application reload
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=find-widget-persistence --browser-test=scripts/test-find-widget-persistence.mjs
      - name: Test no-definition message lifecycle
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=sample.no-definition-message-lifecycle
      - name: Test auto closing quotes setting
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-auto-closing-quotes-setting
        shell: bash
      - name: Test editor breadcrumbs
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-breadcrumbs
        shell: bash
      - name: Test editor line height respects font size
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-line-height-min-font-size
        shell: bash
      - name: Test workspace edits update split editor groups
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-workspace-edit-split-groups
        shell: bash
      - name: Test live editor line height updates the cursor
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-line-height-live-cursor
        shell: bash
      - name: Test tab completion setting select and persistence
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.settings-tab-completion-select
      - name: Test HTML snippet Tab stops
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=editor.html-input-snippet-tabstop
      - name: Test highlighted editor horizontal virtualization
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-highlighted-horizontal-virtualization

      - name: Test horizontal cursor and diagnostic geometry
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-horizontal-geometry --browser-test=scripts/test-horizontal-geometry.mjs
        shell: bash
      - name: Test editor horizontal virtualization
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.editor-horizontal-virtualization --browser-test=scripts/test-horizontal-virtualization.mjs
        shell: bash
      - name: Test settings select defaults and persistence
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.settings-select-item
        shell: bash
      - name: Test bundled font loading
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: node scripts/test-font-loading.mjs
        shell: bash
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
